name: EV Orchestrator
version: "0.3.9"
slug: ev_orchestrator
description: >-
  Central monitor, audit and future controller for Citroën/MG charging in Home Assistant.
url: https://github.com/mortalone/ha-ev-orchestrator
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8099
ingress_stream: true
panel_icon: mdi:ev-station
panel_title: EV Orchestrator
panel_admin: true
homeassistant_api: true
map:
  - type: homeassistant_config
    read_only: true
options:
  log_level: info
schema:
  log_level: list(trace|debug|info|warning|error)
